# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Environment variable overrides supported)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apimonitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Background Worker Pool Configuration
app.worker.core-pool-size=4
app.worker.max-pool-size=8
app.worker.queue-capacity=100
app.worker.poll-interval-ms=1000
app.worker.batch-size=5

# Retry & Exponential Backoff Configuration
app.retry.max-attempts=3
app.retry.initial-interval-seconds=1
app.retry.backoff-multiplier=2

# Outbound HTTP Client Configuration
app.http.connect-timeout-ms=5000
app.http.read-timeout-ms=10000
app.http.allow-loopback=false

